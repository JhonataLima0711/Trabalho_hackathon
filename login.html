<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Entrar | Revalora</title><link rel="stylesheet" href="css/styles.css"></head>
<body class="auth-v2">
  <main class="auth-box">
    <a class="logo" href="index.html"><span>↻</span> revalora</a>
    <div class="auth-title"><span class="tag">ACESSO</span><h1>Entrar</h1><p>Abra o painel da sua empresa.</p></div>
    <div id="authAlert" class="alert hidden"></div>
    <form id="loginForm" class="form-v2">
      <label>E-mail<input id="loginEmail" type="email" placeholder="empresa@email.com" required></label>
      <label>Senha<div class="password"><input id="loginPassword" type="password" placeholder="••••••" required><button type="button" class="show-pass" data-target="loginPassword">mostrar</button></div></label>
      <button class="btn solid wide" type="submit">Entrar →</button>
    </form>
    <div class="auth-bottom"><span>Ainda não tem conta?</span><a href="cadastro.html">Criar cadastro</a></div>
    <small class="demo-note">MVP: o acesso é simulado no navegador.</small>
  </main>
  <script src="js/app.js"></script><script src="js/auth.js"></script>
</body>
</html>
